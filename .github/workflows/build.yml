name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Dedicated hard-fail gate: vite/esbuild strips types and vitest only asserts
  # runtime behavior, so a red `tsc` is otherwise invisible. Keep this job
  # separate from build/test so failures are legible as the "Typecheck" check.
  # Intended as a required status check on main (see docs/reference/TESTING.md).
  # `pnpm lint` rides in this job rather than a new one so it lands inside the
  # existing required check instead of adding an unrequired one; the job name
  # stays `Typecheck` so branch protection does not have to be re-pointed.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      CI: true
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (typed surface)
        run: pnpm typecheck

      # Vitest only strips types, so a test's mocks and fixtures were never
      # checked (#518 E: 47 errors, some of them wrong mock types).
      - name: Typecheck tests
        run: pnpm typecheck:test

      # `pnpm lint` exits non-zero on errors only; the warnings are a tracked
      # backlog (see eslint.config.js). `--max-warnings` turns that backlog into
      # a ratchet: errors still fail the build, and so does any NEW warning,
      # while the existing ones stay non-blocking. The number below is the
      # committed baseline — lower it whenever the count drops, never raise it.
      # It covers every rule in the backlog, not just the two R3F ones, and
      # needs no commit-hook infrastructure or per-directory config overrides.
      # 138 → 20 in #521 F: what is left is react-hooks/exhaustive-deps where
      # the fix would change when a memo / effect re-runs, and src/vehicles/.
      - name: Lint
        run: pnpm lint --max-warnings 20

  build-without-emscripten:
    name: Build without Emscripten
    runs-on: ubuntu-latest
    env:
      CI: true
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Confirm Emscripten is absent
        run: |
          if command -v emcc >/dev/null 2>&1; then
            echo "emcc is unexpectedly available on this runner"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation paths
        run: node scripts/validate-markdown-paths.js

      - name: Host C++ smoke (no Emscripten)
        run: pnpm test:native

      - name: Instantiate committed watershed_native pair
        run: node emscripten/smoke_test.mjs

      # `tee` keeps the full vite log for the chunk guard below (#485 A): pipefail
      # makes a failed build still fail this step.
      - name: Build production bundle
        shell: bash
        run: pnpm build 2>&1 | tee build.log

      - name: Assert build output exists
        run: test -f build/index.html

      - name: Chunk guard (no node stack in the GLSL entry)
        run: node scripts/check-build-manifest.mjs --chunks --build-log build.log

      # Prints the chunk table and fails on a ceiling in build-budget.json (#485 D).
      - name: Payload budget
        run: node scripts/check-build-manifest.mjs --budget

      - name: Run test suite
        run: pnpm test

      # Wall-time and heap budgets (*.perf.test.ts): their own step, so a
      # behaviour failure and a slow runner never read the same. The perf
      # project retries a missed budget twice before failing.
      - name: Perf budgets
        run: pnpm test:perf

  # Headless WebGL visual smoke (SwiftShader). Required: a best-effort shot's
  # pixel diff is informational (SwiftShader in-run frames vary), but the
  # harness fails on the required start-menu shot, a missing baseline, a
  # native module fetched twice, or hard page errors (#518 C).
  visual-smoke:
    name: Visual smoke (WebGL)
    runs-on: ubuntu-latest
    env:
      CI: true
      WATERSHED_URL: http://127.0.0.1:4173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Confirm Emscripten is absent
        run: |
          if command -v emcc >/dev/null 2>&1; then
            echo "emcc is unexpectedly available on this runner"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: Build production bundle (no Emscripten required)
        run: pnpm build

      - name: Start Vite preview
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"
          exit 1

      - name: Run visual smoke harness
        env:
          VISUAL_BOOT_RETRIES: "2"
        run: pnpm test:visual-smoke
        timeout-minutes: 20

      - name: Upload visual-smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-output
          path: |
            verification/output/visual-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Vite preview
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" 2>/dev/null || true
          fi

  # The determinism gates (#518 C), required. They used to ride in the soft
  # visual-smoke job, so none of them had ever blocked a merge. Gameplay runs
  # on sim time (eslint "sim time" rule), so these must give the same splits
  # on any runner under any load.
  determinism:
    name: Determinism smoke
    runs-on: ubuntu-latest
    env:
      CI: true
      WATERSHED_URL: http://127.0.0.1:4173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: Build production bundle (no Emscripten required)
        run: pnpm build

      - name: Start Vite preview
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"
          exit 1

      # #486 A: a scripted meander run stepped headlessly at a fixed 1/60 s
      # (frameloop="never"); gates on the segment-3 split and on two runs
      # producing identical split times.
      - name: Scripted input smoke (keyboard)
        run: pnpm test:input-smoke
        timeout-minutes: 15

      # #486 B: the same run, gamepad-shaped (analog stick, RB sprint).
      - name: Scripted input smoke (gamepad)
        run: pnpm test:input-smoke:gamepad
        timeout-minutes: 15

      # #464 A: record that run as a .wsghost, then `?replay=` it twice in
      # fresh browsers; gates on identical split times and identical SWE
      # state checksums at every split.
      - name: Replay determinism smoke
        run: pnpm test:replay-smoke
        timeout-minutes: 20

      # #435: the WGSL SWE twin must track the committed C++ stepper within
      # 1e-5. Runs in headless Chrome on SwiftShader's WebGPU adapter; brings
      # up its own Vite dev server, independent of the preview above.
      - name: WGSL SWE twin parity
        run: pnpm test:wgsl
        timeout-minutes: 10

      - name: Stop Vite preview
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" 2>/dev/null || true
          fi

  build-with-emscripten:
    name: Build with Emscripten
    runs-on: ubuntu-latest
    env:
      CI: true
      WATERSHED_WASM_INTEGRATION: "1"
      WATERSHED_WASM_MAX_BYTES: "131072"
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation paths
        run: node scripts/validate-markdown-paths.js

      - name: Instantiate committed watershed_native pair
        run: node emscripten/smoke_test.mjs

      # build.sh exits 1 unless emcc matches emscripten/EMCC_VERSION, so this
      # step also proves setup-emsdk's version and the repo pin agree. `build:full`
      # is the deploy path (build_and_patch.py): pinned wasm, then the bundle on top.
      - name: Compile watershed_native.wasm and build the bundle
        run: pnpm build:full

      - name: Assert build output exists
        run: test -f build/index.html

      - name: Assert WASM artifacts match the pinned emcc rebuild
        run: |
          test -f public/watershed_native.wasm
          test -f public/watershed_native.js
          WASM_SIZE=$(wc -c < public/watershed_native.wasm)
          echo "watershed_native.wasm size: ${WASM_SIZE} bytes"
          test "${WASM_SIZE}" -lt 131072
          git diff --exit-code -- \
            public/watershed_native.js \
            public/watershed_native.wasm \
            emscripten/watershed_native.symbols \
            src/systems/water/wasmArtifactStamp.ts
          # The symbol map never ships (#502 B); it is copied next to the JS maps.
          test ! -e public/watershed_native.js.symbols
          test ! -e build/watershed_native.js.symbols
          ls build-sourcemaps/watershed_native.*.symbols

      - name: Run WASM integration tests against real binary
        run: |
          node emscripten/smoke_test.mjs
          pnpm test:wasm
          pnpm test:wasm:parity

      - name: Compile threaded WASM variant
        run: pnpm build:wasm:threads

      - name: Assert threaded WASM artifact is built aside, shipped pair untouched
        run: |
          test -f emscripten/build-threads/out/watershed_native.wasm
          git diff --exit-code -- \
            public/watershed_native.js \
            public/watershed_native.wasm \
            emscripten/watershed_native.symbols \
            src/systems/water/wasmArtifactStamp.ts

  # The Debug wasm (SAFE_HEAP, ASSERTIONS=2, STACK_OVERFLOW_CHECK=2, libc++
  # debug-mode hardening) under the same integration suites as the shipped
  # pair: bounds are checked in real wasm32, where size_t is 32 bits and an
  # out-of-range span index is an abort instead of a silent read. The host
  # ASan / fuzz builds are LP64 and cannot see that. Built aside
  # (emscripten/build-debug/out); nothing here writes public/.
  wasm-debug:
    name: Debug WASM (SAFE_HEAP + libc++ hardening) integration
    runs-on: ubuntu-latest
    env:
      CI: true
      WATERSHED_WASM_INTEGRATION: "1"
      WATERSHED_NATIVE_DIR: emscripten/build-debug/out
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile the Debug wasm
        run: pnpm build:wasm:debug

      - name: Shipped pair untouched
        run: |
          test -f emscripten/build-debug/out/watershed_native.wasm
          git diff --exit-code -- \
            public/watershed_native.js \
            public/watershed_native.wasm \
            emscripten/watershed_native.symbols \
            src/systems/water/wasmArtifactStamp.ts

      - name: Integration suites against the Debug wasm
        run: |
          node emscripten/smoke_test.mjs
          pnpm test:wasm
          pnpm test:wasm:parity
          pnpm exec vitest run --project unit src/systems/water/wasmSentinels.test.ts src/systems/water/wasmTrap.test.ts

  # #467: the plain C ABI should not depend on the emcc version. Build the same
  # sources with the current emsdk (aside — WATERSHED_ALLOW_EMCC_MISMATCH never
  # touches public/) and diff the _ws_* export list and arities against the
  # committed pinned pair. Informational: a new emsdk can break this without
  # blocking a PR, but the log says exactly which export moved.
  wasm-exports-current-emsdk:
    name: WASM exports on current emsdk (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: true
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Emscripten (latest)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build aside with the current emcc
        run: |
          emcc --version | head -n1
          WATERSHED_ALLOW_EMCC_MISMATCH=1 pnpm build:wasm
          git diff --exit-code -- public/ src/systems/water/wasmArtifactStamp.ts

      - name: Export list matches the pinned pair
        run: node scripts/wasm-exports.mjs public emscripten/build/out

  # #467 / #502: the C ABI trusts JS for every heap pointer and width * height.
  # Host build of the compute TUs under ASan + UBSan, 60 s of libFuzzer per
  # entry-point family (swe, chores, forces + particles, routing),
  # and clang-tidy bugprone/performance over every TU, bindings.cpp included.
  native-sanitizers:
    name: Native sanitizers, fuzz, tidy
    runs-on: ubuntu-24.04
    env:
      CI: true
      PUPPETEER_SKIP_DOWNLOAD: true
      CXX_FUZZ: clang++-18
      CLANG_TIDY: clang-tidy-18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install clang 18 + clang-tidy 18
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18

      - name: Host smoke under ASan + UBSan
        run: pnpm test:native:sanitize

      - name: clang-tidy (bugprone-*, performance-*)
        run: pnpm lint:native

      - name: Fuzz every entry-point family, 60 s each
        run: pnpm test:native:fuzz

      - name: Upload fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
