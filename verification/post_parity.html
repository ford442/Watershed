<!doctype html>
<!--
  GLSL vs TSL parity harness: the post chain (#466 Phase A) and one scene per
  dual material host (#555 Phase A). Driven by verification/post_parity.mjs;
  served by a Vite dev server. `?only=post` / `?only=hosts` runs one half.
-->
<html>
  <head><meta charset="utf-8" /><title>Post parity</title></head>
  <body style="margin:0;background:#000">
    <pre id="out" style="color:#ccc">running…</pre>
    <script type="module">
      import { runPostParity } from '/src/debug/postParity.ts';
      import { runHostParity } from '/src/debug/hostParity.ts';

      const out = document.getElementById('out');
      const only = new URLSearchParams(location.search).get('only');
      try {
        const results = only === 'hosts' ? [] : await runPostParity();
        const hosts = only === 'post' ? [] : await runHostParity();
        window.__postParity = { results, hosts };
        out.textContent = JSON.stringify(
          { results: results.map((r) => r.scenario), hosts: hosts.map((h) => h.scene) },
          null,
          2,
        );
      } catch (error) {
        window.__postParity = { error: String((error && error.stack) || error) };
        out.textContent = window.__postParity.error;
      }
    </script>
  </body>
</html>
